name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    name: Flutter and Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.50.0"

      - name: Cache test dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            ~/.pub-cache
            .dart_tool
          key: tests-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'rust/Cargo.lock') }}
          restore-keys: |
            tests-${{ runner.os }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate app version file
        run: dart run tool/generate_version.dart

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        working-directory: rust
        run: cargo test --locked
